[project]
name = "titanic-mlops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abdelrahman Ezz", email = "abdelrahmanezzeldeen1@gmail.com" }
]
requires-python  = ">=3.12,<3.13"
dependencies = [
    "dagshub>=0.7.1",
    "dvc>=3.67.1",
    "hydra-core>=1.3.4",
    "joblib>=1.5.3",
    "mlflow>=3",
    "pandas>=2.2,<3",
    "protobuf<5",
    "scikit-learn>=1.9.0",
]

[project.scripts]
titanic-mlops = "titanic_mlops:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
